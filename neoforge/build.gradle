plugins {
    // 移除Shadow插件
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // 添加用于Jar-in-Jar的配置
    library
    implementation.extendsFrom library
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$project.architectury_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    
    // 使用implementation代替shadowBundle
    implementation(project(path: ':common', configuration: 'transformProductionNeoForge'))
    implementation "org.xerial:sqlite-jdbc:3.47.2.0"
    implementation "com.mysql:mysql-connector-j:8.4.0"
    
    modImplementation "curse.maven:supermartijn642s-config-lib-438332:${project.config_library_file_neoforge}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "config_library_version", config_library_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                "version": project.version,
                "config_library_version": config_library_version
        ])
    }
}

// 添加处理库文件的任务
tasks.register('nestedJars', Jar) {
    archiveClassifier = "nested"
    from {
        configurations.library.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude "META-INF/**"
}

// 修改jar任务以包含库文件
jar {
    dependsOn nestedJars
    from("${buildDir}/libs/${nestedJars.archiveFile.get().asFile.name}") {
        into "META-INF/jars/"
    }
    archiveClassifier = "neoforge-dev"
}

// 移除对shadowJar的引用
remapJar {
    archiveClassifier = "neoforge"
    dependsOn jar
}

remapSourcesJar {
    archiveClassifier = "neoforge-sources"
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")
    project {
        id = project.curse_forge_project_id
        releaseType = project.curse_forge_release_type
        changelogType = "markdown"
        changelog = rootProject.file('changelog.md')
        addGameVersion project.minecraft_version
        addGameVersion "Java 21"
        addGameVersion "NeoForge"

        relations {
            requiredDependency("architectury-api")
            requiredDependency("supermartijn642s-config-lib")
        }

        mainArtifact(remapJar) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version"
        }

        addArtifact(remapSourcesJar) {
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_API_KEY")
    projectId = "8oGVUFuX"
    versionName = "GriefLogger NeoForge $rootProject.minecraft_version - $rootProject.mod_version"
    versionNumber = "$rootProject.mod_version"
    versionType = "$rootProject.curse_forge_release_type"
    uploadFile = remapJar
    additionalFiles = [remapSourcesJar]
    gameVersions = ["$rootProject.minecraft_version"]
    loaders = ["neoforge"]
    dependencies {
        required.project "architectury-api"
        required.project "supermartijn642s-config-lib"
    }
}
